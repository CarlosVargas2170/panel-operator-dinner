services:
  - type: web
    name: nexus-mesero06
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn nexus_panel_app:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PANEL_USER
        sync: false
      - key: PANEL_PASSWORD
        sync: false
      - key: PANEL_SESSION_SECRET
        generateValue: true
      - key: PANEL_PUBLIC_URL
        sync: false
      - key: MESERO06_SOCKET_URL
        value: http://100.87.64.123:5000
      - key: MESERO06_MINI_URL
        value: http://100.87.64.123:5050
      - key: MESERO06_TTS_URL
        value: http://100.87.64.123:9000
      - key: MESERO06_TTS_TOKEN
        sync: false
      - key: MESERO06_REMOTE_SUPERVISADO
        value: '1'
      - key: MESERO06_ENABLE_DRIVE
        value: '1'
      - key: CAMERA_HLS_PROXY_ENABLED
        value: '0'
      - key: CAMERA_HLS_BASE_URL
        value: http://dvr.nexarobotics.org
